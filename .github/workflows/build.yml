# Builds the app and runs the JVM unit tests on every push and pull request, so a change that does
# not compile is caught right away rather than in Android Studio.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the long-removed "tools" package, which current
          # cmdline-tools no longer find, failing the step.
          packages: "platform-tools"

      - name: Install the compile SDK
        run: |
          sdk=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-${sdk}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew :app:testFytDebugUnitTest --stacktrace

      - name: Build (fyt debug)
        run: bash ./gradlew :app:assembleFytDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: fyt-debug-apk
          path: app/build/outputs/apk/fyt/debug/*.apk
          if-no-files-found: warn

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
