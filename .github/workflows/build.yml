# Builds the app and runs the JVM unit tests on every push and pull request, so a change that does
# not compile is caught right away rather than in Android Studio.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the long-removed "tools" package, which current
          # cmdline-tools no longer find, failing the step.
          packages: "platform-tools"

      - name: Install the compile SDK
        run: |
          sdk=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          # Newer platforms carry a minor version in the package name (android-37.0, android-36.1):
          # take the exact name if it exists, else the newest android-<sdk>.<n>.
          pkg=$(sdkmanager --list 2>/dev/null \
            | grep -oP "^\s*\Kplatforms;android-${sdk}(\.[0-9]+)?(?=\s)" \
            | sort -uV | awk -v exact="platforms;android-${sdk}" '$0 == exact { e = $0 } { last = $0 } END { print (e != "" ? e : last) }')
          if [ -z "$pkg" ]; then
            echo "::warning::No SDK platform package found for compileSdk ${sdk}; leaving it to Gradle"
            exit 0
          fi
          echo "Installing ${pkg}"
          sdkmanager "${pkg}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew :app:testSystemDebugUnitTest --stacktrace

      - name: Build (system debug)
        run: bash ./gradlew :app:assembleSystemDebug --stacktrace

      - name: Build (standard debug)
        run: bash ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Build the VD host Magisk module
        run: bash ./gradlew :vdhost-server:magiskZip --stacktrace

      - name: Upload the VD host Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: vdhost-magisk-module
          path: vdhost/server/build/outputs/magisk/*.zip
          if-no-files-found: error

      - name: Upload the APK (system debug)
        uses: actions/upload-artifact@v4
        with:
          name: system-debug-apk
          path: app/build/outputs/apk/system/debug/*.apk
          if-no-files-found: warn

      - name: Upload the APK (standard debug)
        uses: actions/upload-artifact@v4
        with:
          name: standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: warn

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
