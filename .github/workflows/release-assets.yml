# Adds update<version>.apk to a published release: a copy of fyt_release_<version>.apk.
#
# The built-in updater of versions up to 1.2.1 downloads releases/download/v<version>/update<version>.apk
# from the latest release, whatever their build. From 1.2.2 on it downloads the file of its own
# build (fyt_release_ or standard_release_), so only the old name needs this copy. The FYT build
# is the one copied: up to 1.2.0 the updater was there only on FYT units. (A standard -- then
# "phone" -- 1.2.1 gets the FYT build too and cannot install it: it needs one update by hand.)
#
# Runs when a release is published; it waits a while for fyt_release_<version>.apk in case the
# files are uploaded after publishing. Run it by hand (Actions > Release assets > Run workflow)
# with the tag for a release published before this workflow, or after replacing the file.
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.2"
        required: true

permissions:
  contents: write

jobs:
  legacy-update-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Copy the FYT build as update<version>.apk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src="fyt_release_${version}.apk"
          dst="update${version}.apk"

          # Up to 10 minutes for the FYT build to be uploaded.
          for i in $(seq 1 30); do
            if gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep -qxF "$src"; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::$src is not in release $TAG; upload it and run this workflow by hand with the tag"
              exit 1
            fi
            echo "Waiting for $src ($i/30)"
            sleep 20
          done

          dir="$(mktemp -d)"
          gh release download "$TAG" -R "$REPO" -p "$src" -D "$dir"
          cp "$dir/$src" "$dir/$dst"
          gh release upload "$TAG" -R "$REPO" "$dir/$dst" --clobber
          echo "Added $dst (a copy of $src) to release $TAG"
